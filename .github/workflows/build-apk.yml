
name: Build AL HASHMI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AL_HASHMI_ANDROID_STUDIO_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      

        - name: Set up Android SDK
          uses: android-actions/setup-android@v4
          with:
            accept-android-sdk-licenses: true
            packages: platform-tools



      - name: Extract project ZIP
        run: unzip -q AL_HASHMI_ANDROID_STUDIO_PROJECT.zip -d project

      - name: Find project files
        run: find project -maxdepth 3 -name build.gradle -o -name settings.gradle

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find the Android project settings.gradle file."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-HASHMI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
